name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: please do not file them here; see SECURITY.md.
        Remove passwords, Wi-Fi names and public IP addresses from anything you paste.
  - type: input
    id: version
    attributes:
      label: C3-DNS version
      description: Release tag, or commit if you built it yourself
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board
      description: Board name / seller and flash size
      placeholder: ESP32-C3 SuperMini, 4 MB
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Web installer
        - Release images with espflash / esptool
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Serial log
      description: "`espflash monitor` output around the problem, if you can get it"
      render: text
