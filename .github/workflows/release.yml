name: Release

# Push a tag like v0.1.0 to build the images, publish a GitHub Release and update the web
# installer on GitHub Pages. "Run workflow" (manual) builds the images as a workflow artifact
# only, without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/esp-toolchain
      - name: Host tests
        working-directory: dnscore
        run: cargo +stable test --locked
      - name: Build firmware
        working-directory: firmware
        run: |
          . ~/export-esp.sh
          cargo build --release --locked
      - name: Package images (StevenBlack blocklist fetched now)
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="0.0.0-dev.${GITHUB_SHA::7}"
          tools/make-release.sh "$version"
          cat dist/THIRD-PARTY-NOTICES.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: c3-dns-images
          path: dist/
      - name: Web installer site
        run: |
          mkdir -p _site
          cp web/* _site/
          cp dist/manifest.json dist/bootloader.bin dist/partition-table.bin dist/c3-dns.bin dist/blocklist.bin _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c3-dns-images
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "C3-DNS $GITHUB_REF_NAME" \
            --generate-notes

  pages:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
